version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sector7-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: sector7
      POSTGRES_PASSWORD: sector7pass
      POSTGRES_DB: sector7
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sector7-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
