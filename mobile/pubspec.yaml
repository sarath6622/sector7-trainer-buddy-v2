name: sector7_mobile
description: 'Sector 7 — gym member & PT session mobile client (Trainer + Client).'
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Secure token storage (access/refresh JWTs)
  flutter_secure_storage: ^9.2.4

  # Charts (replaces Recharts) — progress screens
  fl_chart: ^0.69.2

  # Date/number formatting
  intl: ^0.19.0

  # ── Added in later phases (need native config; see docs/flutter-migration-plan.md) ──
  # drift + sqlite3_flutter_libs   → Phase 3 offline workout queue (replaces Dexie)
  # connectivity_plus             → Phase 3 online/offline detection
  # workmanager                   → Phase 3 background sync
  # firebase_core + firebase_messaging → Phase 4 native push (replaces FCM web-push)
  # pusher_channels_flutter       → Phase 2/4 real-time session timer (reuses existing Pusher app)
  # image_picker                  → Phase 3 profile image upload (Cloudinary signed)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
