name: sector7_mobile
description: 'Sector 7 — gym member & PT session mobile client (Trainer + Client).'
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Secure token storage (access/refresh JWTs)
  flutter_secure_storage: ^9.2.4

  # Charts (replaces Recharts) — progress screens
  fl_chart: ^0.69.2

  # Inter font — matches the PWA's --font-sans (next/font Inter). Fetched at
  # runtime + cached; bundle the .ttf as an asset before release for offline.
  google_fonts: ^6.2.1

  # Date/number formatting
  intl: ^0.19.0

  # Profile image picking (gallery/camera) → uploads via /api/client/profile/image
  image_picker: ^1.1.2

  # ── Phase 3 offline workout logger (write-local-first + diff sync; ADR-041) ──
  # Local SQLite store for workout drafts + exercise-library cache (replaces Dexie).
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0
  # Online/offline detection that drives the sync flush.
  connectivity_plus: ^6.1.0
  pusher_channels_flutter: ^2.4.0

  # ── Added in later phases (need native config; see docs/flutter-migration-plan.md) ──
  # workmanager                   → true OS-background sync (deferred; needs iOS BGTaskScheduler
  #                                 config + can't verify on a simulator — the foreground /
  #                                 resume / connectivity-driven sync below covers the
  #                                 gym-floor flaky-wifi case). Seam: WorkoutSyncService.flushPending.
  # firebase_core + firebase_messaging → Phase 4 native push (replaces FCM web-push)
  # pusher_channels_flutter       → Phase 2/4 real-time session timer (reuses existing Pusher app)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift codegen for the local store (run: dart run build_runner build).
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  # Inter bundled locally so the offline-first app never fetches fonts at
  # runtime. google_fonts matches these by the `Inter-<Variant>` filename and
  # loads them from the bundle (allowRuntimeFetching is disabled in main.dart).
  # These are the exact full TTFs google_fonts would otherwise download.
  assets:
    - assets/fonts/
